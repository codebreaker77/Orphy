<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orphy Bunny</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 100%;
      height: 100%;
      user-select: none;
    }
    #bunny-canvas {
      display: block;
      width: 140px;
      height: 160px;
      cursor: grab;
    }
    #bunny-canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <canvas id="bunny-canvas" width="140" height="160"></canvas>

  <script src="js/theme.js"></script>
  <script src="js/bunny-pet.js"></script>
</body>
</html>
