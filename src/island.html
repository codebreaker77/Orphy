<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orphy Island</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/island.css">
</head>
<body>
  <!-- Dynamic Island Container with 3 morphing states: state-expanded (default), state-compact, state-collapsed -->
  <div id="island-container" class="pixel-box state-expanded">
    <!-- Notification Toast Banners -->
    <div id="track-toast" class="pixel-toast">★ NOW PLAYING ★</div>
    <div id="volume-toast" class="pixel-toast">VOL: 100%</div>
    <div id="lock-badge" class="pixel-badge" title="Position Locked">🔒</div>

    <!-- ========================================================
         COLLAPSED CAPSULE VIEW (Visible in .state-collapsed)
         ======================================================== -->
    <div id="collapsed-deck">
      <div class="mini-art-thumb">
        <canvas id="mini-art-canvas" width="22" height="22"></canvas>
      </div>
      <div id="mini-title-wrap">
        <span id="mini-song-title">WAITING FOR MUSIC...</span>
      </div>
      <div class="mini-actions">
        <button id="mini-btn-toggle" class="mini-ctrl-btn" title="Play/Pause">⏵</button>
        <div class="mini-eq-bars" title="Audio Activity">
          <span class="m-bar mb-1"></span>
          <span class="m-bar mb-2"></span>
          <span class="m-bar mb-3"></span>
        </div>
        <button id="mini-btn-expand" class="mini-ctrl-btn" title="Expand Player">▲</button>
      </div>
    </div>

    <!-- ========================================================
         EXPANDED FULL HI-FI PLAYER (Visible in .state-expanded)
         ======================================================== -->
    <div id="expanded-deck">
      <!-- 1. HERO TITLE & METADATA ROW -->
      <div id="header-row">
        <div id="hero-meta">
          <div id="song-title">ROBBERS</div>
          <div id="meta-subline">
            <span id="song-artist">THE 1975</span>
            <span id="vibe-badge" class="pixel-chip">⚡ STEREO</span>
          </div>
        </div>

        <!-- Micro-Actions: Carrot, Recall, Heart, Mode Collapse -->
        <div id="header-actions">
          <button id="btn-carrot" class="pixel-action-btn" title="Feed Carrot 🥕">
            <svg viewBox="0 0 16 16" width="15" height="15">
              <path fill="#22c55e" d="M10,1 h4 v2 h-4 z M12,3 h2 v2 h-2 z M8,3 h2 v2 h-2 z"/>
              <path fill="#ea580c" d="M6,5 h4 v2 h-4 z M5,7 h5 v2 h-5 z M4,9 h4 v2 h-4 z M3,11 h3 v2 h-3 z M2,13 h2 v2 h-2 z"/>
              <path fill="#fb923c" d="M7,5 h2 v2 h-2 z M6,7 h2 v1 h-2 z M5,9 h2 v1 h-2 z"/>
            </svg>
          </button>

          <button id="btn-recall" class="pixel-action-btn" title="Call Bunny Back (Curvy Jetpack Flight)">
            <svg viewBox="0 0 16 16" width="15" height="15">
              <path class="pixel-path" d="M3,1 h2 v4 h-2 z M11,1 h2 v4 h-2 z M4,4 h8 v2 h-8 z M2,6 h12 v6 h-12 z M4,8 h2 v2 h-2 z M10,8 h2 v2 h-2 z M7,10 h2 v2 h-2 z"/>
            </svg>
          </button>
          
          <button id="btn-heart" class="pixel-action-btn" title="Favorite">
            <svg viewBox="0 0 16 16" width="15" height="15">
              <path class="pixel-path" d="M2,3 h4 v2 h-4 z M10,3 h4 v2 h-4 z M0,5 h16 v2 h-16 z M0,7 h16 v2 h-16 z M2,9 h12 v2 h-12 z M4,11 h8 v2 h-8 z M6,13 h4 v2 h-4 z M7,14 h2 v1 h-2 z"/>
            </svg>
          </button>

          <button id="btn-collapse" class="pixel-action-btn" title="Collapse into Dynamic Pill">
            <svg viewBox="0 0 16 16" width="13" height="13">
              <path class="pixel-path" d="M2,10 h12 v2 h-12 z M4,7 h8 v2 h-8 z M6,4 h4 v2 h-4 z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- 2. MID-DECK: CLEAN ALBUM ART + EXTENDED 16-BAND EQ + SCRUBBER -->
      <div id="mid-deck">
        <!-- Clean Square Album Art Container -->
        <div id="album-art-container" title="Album Art">
          <canvas id="album-canvas" width="64" height="64"></canvas>
          <div id="no-art">
            <span class="pixel-note">♪</span>
          </div>
        </div>

        <!-- Right Side: Extended 16-Band EQ & Scrubber Deck -->
        <div id="deck-right">
          <!-- Extended 16-Band Hi-Fi Spectrum Analyzer -->
          <div id="spectrum-deck" title="16-Band Hi-Fi Spectrum Analyzer">
            <div class="spectrum-bar-container" id="pixel-equalizer">
              <div class="eq-col"><div class="eq-peak"></div><div class="eq-bar"></div></div>
              <div class="eq-col"><div class="eq-peak"></div><div class="eq-bar"></div></div>
              <div class="eq-col"><div class="eq-peak"></div><div class="eq-bar"></div></div>
              <div class="eq-col"><div class="eq-peak"></div><div class="eq-bar"></div></div>
              <div class="eq-col"><div class="eq-peak"></div><div class="eq-bar"></div></div>
              <div class="eq-col"><div class="eq-peak"></div><div class="eq-bar"></div></div>
              <div class="eq-col"><div class="eq-peak"></div><div class="eq-bar"></div></div>
              <div class="eq-col"><div class="eq-peak"></div><div class="eq-bar"></div></div>
              <div class="eq-col"><div class="eq-peak"></div><div class="eq-bar"></div></div>
              <div class="eq-col"><div class="eq-peak"></div><div class="eq-bar"></div></div>
              <div class="eq-col"><div class="eq-peak"></div><div class="eq-bar"></div></div>
              <div class="eq-col"><div class="eq-peak"></div><div class="eq-bar"></div></div>
              <div class="eq-col"><div class="eq-peak"></div><div class="eq-bar"></div></div>
              <div class="eq-col"><div class="eq-peak"></div><div class="eq-bar"></div></div>
              <div class="eq-col"><div class="eq-peak"></div><div class="eq-bar"></div></div>
              <div class="eq-col"><div class="eq-peak"></div><div class="eq-bar"></div></div>
            </div>
          </div>

          <!-- Interactive Progress Scrubber Deck -->
          <div id="progress-section">
            <div id="progress-bar-wrap">
              <div id="progress-bar" title="Drag or Click to Seek Position">
                <div id="progress-fill">
                  <div id="progress-handle"></div>
                </div>
                <div id="scrub-tooltip" class="pixel-tooltip">0:00</div>
              </div>
            </div>
            <div id="time-row">
              <span id="time-current">0:00</span>
              <span id="time-total">0:00</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 3. CENTERED TRANSPORT CONTROLS: ↶ ◀ [▶] ▶ ↷ -->
      <div id="controls">
        <!-- Shuffle ↶ -->
        <button id="btn-shuffle" class="pixel-ctrl-btn" title="Shuffle">
          <svg viewBox="0 0 14 14" width="12" height="12">
            <path class="pixel-path" d="M1,2 h3 v2 h-3 z M4,4 h2 v2 h-2 z M6,6 h2 v2 h-2 z M8,8 h3 v-2 h2 v5 h-5 v-2 h3 z M1,11 h3 v-2 h-3 z M4,9 h2 v-2 h-2 z M8,5 h3 v2 h2 v-5 h-5 v2 h3 z"/>
          </svg>
        </button>

        <!-- Previous ◀ -->
        <button id="btn-prev" class="pixel-ctrl-btn" title="Previous">
          <svg viewBox="0 0 16 16" width="13" height="13">
            <path class="pixel-path" d="M1,2 h2 v12 h-2 z M4,8 h2 v2 h-2 z M4,6 h2 v2 h-2 z M6,5 h2 v6 h-2 z M8,3 h2 v10 h-2 z M10,8 h2 v2 h-2 z M10,6 h2 v2 h-2 z M12,5 h2 v6 h-2 z M14,3 h2 v10 h-2 z"/>
          </svg>
        </button>

        <!-- Main Tactile Play/Pause Disc [▶] -->
        <button id="btn-toggle" class="pixel-main-btn" title="Play/Pause">
          <div class="pixel-disc">
            <svg id="icon-pause" viewBox="0 0 16 16" width="12" height="12">
              <path d="M3,3 h3 v10 h-3 z M10,3 h3 v10 h-3 z" fill="#111420"/>
            </svg>
            <svg id="icon-play" viewBox="0 0 16 16" width="12" height="12" style="display:none; margin-left:2px;">
              <path d="M4,2 h3 v2 h-3 z M4,4 h5 v2 h-5 z M4,6 h7 v2 h-7 z M4,8 h9 v2 h-9 z M4,10 h7 v2 h-7 z M4,12 h5 v2 h-5 z M4,14 h3 v-2 h-3 z" fill="#111420"/>
            </svg>
          </div>
        </button>

        <!-- Next ▶ -->
        <button id="btn-next" class="pixel-ctrl-btn" title="Next">
          <svg viewBox="0 0 16 16" width="13" height="13">
            <path class="pixel-path" d="M13,2 h2 v12 h-2 z M10,8 h2 v2 h-2 z M10,6 h2 v2 h-2 z M8,5 h2 v6 h-2 z M6,3 h2 v10 h-2 z M4,8 h2 v2 h-2 z M4,6 h2 v2 h-2 z M2,5 h2 v6 h-2 z M0,3 h2 v10 h-2 z"/>
          </svg>
        </button>

        <!-- Repeat ↷ -->
        <button id="btn-repeat" class="pixel-ctrl-btn" title="Repeat">
          <svg viewBox="0 0 14 14" width="12" height="12">
            <path class="pixel-path" d="M1,3 h10 v2 h-10 z M11,3 h2 v6 h-2 z M9,7 v2 h3 v-2 z M13,8 v3 h-2 v-1 h-8 v-2 h8 z M1,6 h2 v4 h-2 z M3,5 v2 h-2 v-2 z M0,4 v3 h2 v-1 h8 v-2 h-8 z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/genre-detector.js"></script>
  <script src="js/island.js"></script>
</body>
</html>
